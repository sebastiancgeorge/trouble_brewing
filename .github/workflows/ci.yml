name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # this job name is the required status check on main; rename both together
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Rule tests
        run: uv run --no-project --with pytest pytest -q

      - name: Server starts and serves both pages
        run: |
          uv run --no-project --with fastapi --with uvicorn --with qrcode --with httpx python - <<'PY'
          import random
          from fastapi.testclient import TestClient
          from game import Game
          from server import create_app

          c = TestClient(create_app(Game(random.Random(1)), "k", "http://localhost/"))
          for path in ("/", "/st", "/api/characters", "/api/state", "/api/st?key=k", "/qr.svg"):
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code, r.text[:200])
          print("server ok")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Page scripts parse
        run: |
          for page in static/*.html; do
            python3 -c "import re, sys; print('\n'.join(re.findall(r'<script>(.*?)</script>', open(sys.argv[1]).read(), re.S)))" "$page" > "$RUNNER_TEMP/page.js"
            node --check "$RUNNER_TEMP/page.js"
            echo "$page ok"
          done
