<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221A2A">
<title>Blood on the Clocktower</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  main { max-width: 30rem; margin: 0 auto; padding: 1rem 1.1rem calc(5rem + env(safe-area-inset-bottom)); }

  /* --- bottom tabs, in thumb reach --- */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    padding: 0 max(0.5rem, env(safe-area-inset-left)) env(safe-area-inset-bottom);
    background: var(--felt-deep); border-top: 1px solid var(--felt-line);
  }
  .tabs button {
    position: relative; flex: 1; max-width: 10rem; min-height: 3.2rem; border: 0; background: none; cursor: pointer;
    color: var(--on-felt-dim); font-weight: 500; box-shadow: inset 0 2px 0 transparent;
  }
  .tabs button[aria-current="page"] { color: var(--accent-text); font-weight: 700; box-shadow: inset 0 2px 0 var(--brass); }
  .tabs .fresh { position: absolute; top: 0.7rem; margin-left: 0.25rem; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--brass-bright); }

  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 1.4rem; }
  .top h1 { font-size: var(--t-xl); color: var(--accent-text); }
  .top .when { font-size: var(--t-sm); color: var(--on-felt-dim); text-align: right; }

  section { margin-top: 2rem; }
  section > h2 { font-size: var(--t-xl); margin-bottom: 0.7rem; }

  /* --- join --- */
  .join { padding: 1.4rem; border-radius: 14px; }
  .join h2 { font-size: var(--t-2xl); margin-bottom: 0.4rem; }
  .join p { margin: 0 0 1rem; color: var(--ink-soft); }
  .join form { display: flex; gap: 0.5rem; }
  .join input { flex: 1; min-width: 0; padding: 0.6em 0.9em; border: 1px solid var(--ink-soft); border-radius: 999px; background: #fff8e6; }

  /* --- role token hero --- */
  .hero { display: grid; justify-items: center; text-align: center; margin-top: 0.5rem; }
  .flip { background: none; border: 0; padding: 0; cursor: pointer; perspective: 900px; border-radius: 50%; }
  .flip .inner { position: relative; width: 15rem; height: 15rem; transition: transform 0.5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
  .flip.open .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; }
  .face.front { transform: rotateY(180deg); }
  .face .token { --size: 15rem; }
  .face .token .char { font-size: var(--t-2xl); }
  .face.back .token { background: radial-gradient(circle at 50% 50%, rgba(178, 58, 51, 0.35), transparent 62%), radial-gradient(circle at 38% 30%, #3B5446, var(--leather) 60%, #182620); }
  .face.back svg { width: 84%; height: 84%; }
  .hero .token.blank .char { font-size: var(--t-lg); padding: 0 1.5rem; }
  .hero .hint { margin-top: 0.9rem; color: var(--on-felt-dim); font-size: var(--t-sm); }
  .ability { margin: 1rem 0 0; max-width: 26rem; text-align: left; }
  .ability .team { font-family: var(--display); font-size: var(--t-lg); }
  .ability p { margin: 0.3rem 0 0; }

  .call {
    display: block; width: 100%; margin-bottom: 1rem; padding: 0.8rem 1rem; border: 1px solid var(--brass); border-radius: 12px;
    background: var(--felt-deep); color: var(--on-felt); text-align: left; cursor: pointer;
  }
  .call b { font-family: var(--display); font-weight: 400; font-size: var(--t-lg); color: var(--accent-text); display: block; }

  /* --- slips of paper from the storyteller --- */
  .slip { margin: 0 0 0.7rem; padding: 0.8rem 1rem; border-radius: 4px; white-space: pre-wrap; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .slip .when { display: block; font-family: var(--display); color: var(--ink-soft); font-size: var(--t-sm); }
  .slip.ask { border-left: 5px solid var(--brass); white-space: normal; }
  .picks { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.8rem 0; }
  .pick { border: 1px solid var(--ink-soft); background: transparent; border-radius: 999px; padding: 0.35em 0.9em; cursor: pointer; font-family: var(--display); font-size: var(--t-md); }
  .pick[aria-pressed="true"] { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .pick.dead { opacity: 0.6; }
  .pick.guess { display: inline-flex; align-items: center; gap: 0.35em; font-size: var(--t-sm); }
  .pick.guess .glyph { width: 1.4em; height: 1.4em; }
  .slip .miss { margin: 0; color: var(--oxblood); font-weight: 700; }
  /* tap challenge: the three to find, in order, above the six to pick from */
  .seq { list-style: none; display: flex; justify-content: center; gap: 0.7rem; margin: 0.8rem 0; padding: 0; counter-reset: n; }
  .seq li { counter-increment: n; position: relative; width: 3.4rem; height: 3.4rem; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: var(--parchment-dim); }
  .seq li::before { content: counter(n); position: absolute; top: -0.35rem; left: -0.35rem; width: 1.2rem; height: 1.2rem; border-radius: 50%; display: grid; place-items: center; font-size: var(--t-xs); font-weight: 700; background: var(--ink); color: var(--parchment); }
  .seq li.got { background: var(--brass-bright); }
  .seq .glyph { width: 2rem; height: 2rem; }
  .grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .grid6 .cell { display: grid; justify-items: center; gap: 0.2rem; padding: 0.6rem 0.2rem 0.45rem; border: 1px solid var(--ink-soft); border-radius: 12px; background: rgba(255, 255, 255, 0.35); color: var(--ink); cursor: pointer; font-size: var(--t-xs); line-height: 1.1; }
  .grid6 .cell .glyph { width: 2.2rem; height: 2.2rem; }
  .grid6 .cell:disabled { background: var(--ink); color: var(--parchment); border-color: var(--ink); cursor: default; }
  .grid6 .cell:disabled span { font-weight: 700; font-size: var(--t-md); }
  .empty { color: var(--on-felt-dim); font-style: italic; }
  textarea.note { width: 100%; min-height: 5rem; padding: 0.7em 0.9em; border-radius: 12px; border: 1px solid var(--felt-line); background: var(--felt-deep); color: var(--on-felt); resize: vertical; }
  .noteactions { display: flex; align-items: center; gap: 0.8rem; margin: 0.6rem 0 1rem; }
  .slip.mine { background: var(--felt-deep); color: var(--on-felt); border: 1px solid var(--felt-line); box-shadow: none; }
  .slip.mine .when { color: var(--on-felt-dim); }

  /* --- town square ring --- */
  .ring { position: relative; width: 100%; aspect-ratio: 1; max-width: 26rem; margin: 0 auto; }
  .ring::before { content: ""; position: absolute; inset: 18%; border-radius: 50%; border: 1px dashed var(--felt-line); }
  .seat { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 4.8rem; }
  .seat .dot { width: 1.9rem; height: 1.9rem; margin: 0 auto 2px; border-radius: 50%; background: var(--parchment); box-shadow: 0 0 0 2px var(--felt-deep); display: grid; place-items: center; color: var(--ink); font-size: var(--t-xs); font-weight: 700; }
  .seat.me .dot { box-shadow: 0 0 0 2px var(--brass-bright); }
  .seat.dead .dot { background: #262626; color: var(--on-felt-dim); }
  .seat .who { font-family: var(--display); font-size: var(--t-sm); line-height: 1.1; overflow-wrap: anywhere; }
  .seat.dead .who { color: var(--on-felt-dim); text-decoration: line-through; }
  .seat small { display: block; font-size: 0.7rem; }
  .ring .center { position: absolute; inset: 30%; display: grid; place-content: center; text-align: center; }
  .ring .center b { font-family: var(--display); font-size: var(--t-3xl); font-weight: 400; line-height: 1; color: var(--accent-text); }
  .ring .center span { font-size: var(--t-sm); color: var(--on-felt-dim); }

  .crier { list-style: none; padding: 0; margin: 0; }
  .crier li { padding: 0.35rem 0; border-bottom: 1px solid var(--felt-line); }

  .verdict { margin-top: 1rem; padding: 1.2rem; border-radius: 14px; text-align: center; }
  .verdict h2 { font-size: var(--t-3xl); }

  .almanac > h2 { font-size: var(--t-xl); }
  .almanac h3 { font-size: var(--t-lg); margin: 1.4rem 0 0.2rem; color: var(--accent-text); }
  .almanac .lede { margin: 0 0 0.4rem; color: var(--on-felt-dim); font-size: var(--t-sm); }
  .almanac .lede b { color: inherit; }
  .almanac details { border-bottom: 1px solid var(--felt-line); }
  .almanac summary { list-style: none; cursor: pointer; padding: 0.6rem 0; display: grid; grid-template-columns: 1.5em 1fr auto; column-gap: 0.45rem; align-items: center; }
  .almanac summary::-webkit-details-marker { display: none; }
  .almanac summary .glyph { width: 1.5em; height: 1.5em; grid-row: span 2; }
  .almanac summary .nm { font-family: var(--display); font-size: var(--t-lg); }
  .almanac summary .tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--on-felt-dim); text-align: right; }
  .almanac summary .sum { grid-column: 2 / 4; color: var(--on-felt-dim); font-size: var(--t-sm); }
  .almanac .body { padding: 0 0 0.8rem calc(1.5em + 0.45rem); font-size: var(--t-sm); }
  .almanac .body p { margin: 0 0 0.5rem; }
  .almanac .body q { display: block; font-style: italic; color: var(--on-felt-dim); }
  .almanac .ref dt { font-family: var(--display); margin-top: 0.6rem; }
  .almanac .ref dd { margin: 0.1rem 0 0; color: var(--on-felt-dim); font-size: var(--t-sm); }
  .almanac ul.ref { margin: 0; padding-left: 1.1rem; font-size: var(--t-sm); }
  .almanac ul.ref li { margin: 0.3rem 0; }
  .almanac table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); text-align: center; }
  .almanac th, .almanac td { padding: 0.3rem 0.2rem; border-bottom: 1px solid var(--felt-line); }
  .almanac th { font-weight: 500; color: var(--on-felt-dim); }
  .almanac tr.here td { color: var(--accent-text); font-weight: 700; }
  .err { color: #ffb4a8; margin-top: 0.6rem; }
  .day-timer { text-align: center; margin: 1rem 0; padding: 0.8rem 1rem; border-radius: 12px; background: var(--felt-deep); border: 1px solid var(--felt-line); }
  .day-timer .clock { font-family: var(--display); font-size: var(--t-3xl); color: var(--accent-text); }
  .day-timer.expired .clock { color: var(--oxblood); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
<main id="app"><p class="empty">Finding the table...</p></main>
<script>
const $app = document.getElementById("app");
let token = localStorage.getItem("tb_token");
let state = null, chars = {}, lastVersion = -1;
let revealed = false, picks = [], error = "", seen = Number(localStorage.getItem("tb_seen") || 0), hideTimer = null, hideAt = 0, view = "character", heard = "", noteDraft = "", noteSent = false, tapError = "", tapSeq = [], tapKey = "";
let lastBuzz = localStorage.getItem("tb_buzz");
let timerEnd = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const team = type => (type === "minion" || type === "demon") ? "evil" : "good";
const tone = type => type === "outsider" ? "outsider" : team(type);
const glyph = id => `<span class="glyph" style="--icon:url(/static/icons/${chars[id]?.icon ?? id + ".svg"})"></span>`;
const scriptName = () => state?.script_name || "Blood on the Clocktower";
let guessPick = null;
const TYPE_LABEL = {townsfolk: "Townsfolk", outsider: "Outsider", minion: "Minion", demon: "Demon"};

// five-leaf clover: the grimoire cover a hidden character sits behind
const LEAF = "M50 50 C40 42 30 33 36 22 C41 13 50 16 50 25 C50 16 59 13 64 22 C70 33 60 42 50 50 Z";
const EMBLEM = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#E0962F" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#E0962F" stroke-width="0.6" stroke-dasharray="1.5 2.5"/>
  ${[...Array(5).keys()].map(i => `<path d="${LEAF}" fill="#22332A" stroke="#F5BC55" stroke-width="1.4" transform="rotate(${i * 72} 50 50)"/>
    <path d="M50 44 L50 27" stroke="#B23A33" stroke-width="0.9" transform="rotate(${i * 72} 50 50)"/>`).join("")}
  <circle cx="50" cy="50" r="3.2" fill="#F5BC55"/></svg>`;

async function api(path, body) {
  const res = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || data.detail?.[0]?.msg || res.statusText);
  return data;
}

async function poll() {
  try {
    state = await api(token ? `/api/state?token=${encodeURIComponent(token)}` : "/api/state");
    error = "";
  } catch (e) {
    if (token && /join again/.test(e.message)) { token = null; localStorage.removeItem("tb_token"); state = null; }
    error = e.message;
  }
  // re-rendering while typing would wipe the name field
  if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  if (!state || state.version !== lastVersion || error) {
    lastVersion = state?.version;
    timerEnd = state?.timer != null ? Date.now() + state.timer * 1000 : null;
    render();
  }
}

async function join(ev) {
  ev.preventDefault();
  try {
    const r = await api("/api/join", {name: document.getElementById("name").value});
    token = r.token;
    localStorage.setItem("tb_token", token);
    localStorage.setItem("tb_seen", "0");
    seen = 0; lastVersion = -1;
    document.activeElement.blur();
    poll();
  } catch (e) { error = e.message; render(); }
}

// tap task: everyone without a real choice taps too, so real choices do not stand out
function tapTask(p) {
  if (p.answer) return `<div class="slip paper ask"><span class="when">Done</span>Keep your phone close until dawn.</div>`;
  const key = p.target.join();
  if (tapKey !== key) { tapKey = key; tapSeq = []; }
  const name = id => esc(chars[id]?.name ?? id);
  return `<div class="slip paper ask"><span class="when">The Storyteller asks</span>${esc(p.text)}
    <ol class="seq">${p.target.map((id, i) => `<li class="${i < tapSeq.length ? "got" : ""}" aria-label="${i + 1}: ${name(id)}">${glyph(id)}</li>`).join("")}</ol>
    <div class="grid6">${p.options.map(id => {
      const at = tapSeq.indexOf(id);
      return `<button class="cell" ${at >= 0 ? "disabled" : ""} onclick="tapIcon('${id}')" aria-label="${name(id)}">${glyph(id)}<span>${at >= 0 ? at + 1 : name(id)}</span></button>`;
    }).join("")}</div>
    ${tapError ? `<p class="miss">${esc(tapError)}</p>` : ""}</div>`;
}

async function tapIcon(id) {
  const target = state.me.prompt.target;
  if (id !== target[tapSeq.length]) { tapSeq = []; tapError = "Not quite. Start again from the first one."; render(); return; }
  tapSeq = [...tapSeq, id];
  tapError = "";
  if (tapSeq.length < target.length) { render(); return; }
  try { await api("/api/tap", {token, sequence: tapSeq}); lastVersion = -1; poll(); }
  catch (e) { tapSeq = []; tapError = e.message; render(); }
}

async function confirmPick(nobody = false) {
  try {
    await api("/api/choose", nobody ? {token, choices: []} : {token, choices: picks, guess: guessPick});
    picks = []; guessPick = null; lastVersion = -1; poll();
  } catch (e) { error = e.message; render(); }
}

function toggleGuess(id) {
  guessPick = guessPick === id ? null : id;
  render();
}

function togglePick(pid, count) {
  if (picks.includes(pid)) picks = picks.filter(p => p !== pid);
  else if (picks.length < count) picks = [...picks, pid];
  render();
}

function flip() {
  revealed = !revealed;
  view = "character";
  clearTimeout(hideTimer);
  if (revealed && state?.me) {
    seen = state.me.messages.length;
    localStorage.setItem("tb_seen", String(seen));
    armHide();
  }
  render();
}

function armHide() {
  clearTimeout(hideTimer);
  // hide again on its own so a phone left on the table does not give the role away
  hideAt = Date.now() + 45000;
  hideTimer = setTimeout(() => { revealed = false; render(); }, 45000);
}

// ticks the countdown text in place; a full render would wipe a note being typed
function tickHide() {
  const e = document.getElementById("hide-in");
  if (e) e.textContent = Math.max(0, Math.ceil((hideAt - Date.now()) / 1000));
}

function tickDayTimer() {
  const e = document.getElementById("day-clock");
  if (!e || !timerEnd) return;
  const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
  const mins = Math.floor(left / 60), secs = left % 60;
  e.textContent = left > 0 ? `${mins}:${secs.toString().padStart(2, '0')}` : "Time's up!";
  e.closest(".day-timer")?.classList.toggle("expired", left === 0);
}

function dayTimer(s) {
  if (s.phase !== "day" || s.timer == null) return "";
  return `<div class="day-timer${s.timer === 0 ? ' expired' : ''}"><div class="clock" id="day-clock">${
    s.timer > 0 ? `${Math.floor(s.timer / 60)}:${(s.timer % 60).toString().padStart(2, '0')}` : "Time's up!"
  }</div></div>`;
}

function show(v) {
  view = v;
  scrollTo(0, 0);
  render();
}

async function sendNote() {
  try {
    await api("/api/note", {token, text: noteDraft});
    noteDraft = "";
    noteSent = true;
    document.activeElement?.blur();
    lastVersion = -1;
    poll();
  } catch (e) { error = e.message; render(); }
}

function noteBox(me) {
  const sent = me.notes.slice().reverse().map(n => `<div class="slip mine"><span class="when">You, ${esc(n.label)}</span>${esc(n.text)}</div>`).join("");
  return `<section><h2>Ask the Storyteller</h2>
    <p class="empty">Questions about the rules, or anything you want only the Storyteller to know.</p>
    <textarea id="note" class="note" maxlength="500" placeholder="Only the Storyteller sees this"
      oninput="noteDraft = this.value; noteSent = false; armHide(); document.getElementById('note-send').disabled = !this.value.trim()">${esc(noteDraft)}</textarea>
    <div class="noteactions"><button class="btn" ${noteDraft.trim() ? "" : "disabled"} id="note-send" onclick="sendNote()">Send to the Storyteller</button>
      ${noteSent ? `<span class="empty">Sent.</span>` : ""}</div>${sent}</section>`;
}

function when(s) {
  return {lobby: "Waiting for everyone to sit down", setup: "The Storyteller is dealing",
          night: `Night ${s.night}`, day: `Day ${s.day}`, over: "The game is over"}[s.phase];
}

function joinScreen() {
  const open = !state || state.phase === "lobby";
  return `<div class="top"><h1>${esc(scriptName())}</h1></div>
    <div class="join paper">${open ? `
      <h2>Take a seat</h2>
      <p>Use the name everyone at the table calls you.</p>
      <form onsubmit="join(event)"><input id="name" placeholder="Your name" autocomplete="off" maxlength="20" required>
      <button class="btn">Join the game</button></form>` : `
      <h2>This game has started</h2>
      <p>Ask the Storyteller to add you to the next one.</p>`}
      ${error ? `<p class="err">${esc(error)}</p>` : ""}</div>`;
}

function hero(me) {
  if (!me.role) {
    const started = ["night", "day", "over"].includes(state.phase);
    const msg = started
      ? (state.dead_eyes ? "Your character is secret. You will learn who you were when you die."
                         : "Your character is dealt when the game starts")
      : (state.dead_eyes ? "Dead Eyes Only: your character will be revealed when you die."
                         : "Your character is dealt when the game starts");
    return `<div class="hero"><div class="token blank" style="--size:15rem"><span class="char">${msg}</span></div></div>`;
  }
  const r = me.role, t = team(r.type), c = tone(r.type);
  return `<div class="hero">
    <button class="flip ${revealed ? "open" : ""}" onclick="flip()" aria-label="${revealed ? "Hide" : "Show"} my character">
      <div class="inner">
        <div class="face back"><div class="token">${EMBLEM}</div></div>
        <div class="face front"><div class="token ${c}"><span class="char">${revealed ? glyph(r.id) + esc(r.name) : ""}</span></div></div>
      </div>
    </button>
    <div class="hint">${revealed ? `Hides by itself in <span id="hide-in">${Math.max(0, Math.ceil((hideAt - Date.now()) / 1000))}</span>s. Tap the token to hide it now.` : "Shield your screen, then tap to see your character"}</div>
    ${revealed ? `<div class="ability"><div class="team ${c}-text">${TYPE_LABEL[r.type]}, ${t === "good" ? "on the good team" : "on the evil team"}</div><p>${esc(r.ability)}</p></div>` : ""}
  </div>`;
}

function prompt(s, me) {
  const p = me.prompt;
  if (!p) return "";
  if (p.kind === "tap") return tapTask(p);
  if (p.answer) {
    const names = [...p.answer.map(pid => esc(s.seats.find(x => x.pid === pid)?.name)),
                   ...(p.answer_guess ? [`the ${esc(chars[p.answer_guess]?.name)}`] : [])].join(" and ") || "nobody";
    return `<div class="slip paper ask"><span class="when">You chose</span>${names}. The Storyteller will tell you what happens.</div>`;
  }
  const options = s.seats.filter(x => p.allow_self || x.pid !== me.pid);
  const guesses = p.guess ? `<div class="picks">${p.guess.map(id => `<button class="pick guess" aria-pressed="${guessPick === id}" onclick="toggleGuess('${id}')">${glyph(id)}${esc(chars[id]?.name ?? id)}</button>`).join("")}</div>` : "";
  const ready = picks.length === p.count && (!p.guess || guessPick);
  return `<div class="slip paper ask"><span class="when">The Storyteller asks</span>${esc(p.text)}
    ${p.count ? `<div class="picks">${options.map(x => `<button class="pick ${x.alive ? "" : "dead"}" aria-pressed="${picks.includes(x.pid)}" onclick="togglePick('${x.pid}', ${p.count})">${esc(x.name)}</button>`).join("")}</div>` : ""}
    ${guesses}
    <button class="btn" ${ready ? "" : "disabled"} onclick="confirmPick()">Confirm choice</button>
    ${p.optional ? `<button class="btn quiet" onclick="confirmPick(true)">Choose nobody</button>` : ""}</div>`;
}

function ring(s, me) {
  const n = s.seats.length;
  const seats = s.seats.map((x, i) => {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2;
    const left = 50 + 38 * Math.cos(a), top = 50 + 40 * Math.sin(a);
    const c = x.character && chars[x.character];
    const note = c ? `<small class="${tone(c.type)}-text">${esc(c.name)}</small>` : (!x.alive ? `<small>${x.ghost_vote ? "has a vote" : "no vote left"}</small>` : "");
    return `<div class="seat ${x.alive ? "" : "dead"} ${x.pid === me.pid ? "me" : ""}" style="left:${left}%;top:${top}%">
      <div class="dot">${i + 1}</div><div class="who">${esc(x.name)}</div>${note}</div>`;
  }).join("");
  const alive = s.seats.filter(x => x.alive).length;
  const center = s.phase === "day"
    ? `<b>${s.threshold}</b><span>votes to execute</span>`
    : `<b>${alive}</b><span>of ${n} alive</span>`;
  return `<div class="ring">${seats}<div class="center">${center}</div></div>`;
}

const TYPE_INTRO = {
  townsfolk: { side: "Good, with helpful abilities", goal: "Work out who the Demon is, and execute them." },
  outsider: { side: "Good, but their ability hurts the good team", goal: "The same as the Townsfolk: execute the Demon." },
  minion: { side: "Evil, and they support the Demon", goal: "Protect the Demon, and survive to the final two." },
  demon: { side: "Evil, and kills at night", goal: "Stay alive, and reduce the town to two living players." },
};
const TYPE_NOTE = {
  trouble_brewing: {
    townsfolk: "Trouble Brewing has 13 Townsfolk. 3, 5, 7 or 9 are in play depending on the player count, or two fewer if the Baron is in the game.",
    outsider: "Trouble Brewing has 4 Outsiders. 0, 1 or 2 are in play depending on the player count, or two more if the Baron is in the game.",
    minion: "Trouble Brewing has 4 Minions. 1, 2 or 3 are in play depending on the player count.",
    demon: "Trouble Brewing has one Demon, the Imp, and there is always exactly one Demon in play.",
  },
  bad_moon_rising: {
    townsfolk: "Bad Moon Rising has 13 Townsfolk. 3, 5, 7 or 9 are in play depending on the player count, one more or one fewer if the Godfather is in the game.",
    outsider: "Bad Moon Rising has 4 Outsiders. 0, 1 or 2 are in play depending on the player count, one more or one fewer if the Godfather is in the game.",
    minion: "Bad Moon Rising has 4 Minions. 1, 2 or 3 are in play depending on the player count.",
    demon: "Bad Moon Rising has 4 Demons, and exactly one of them is in play. Each kills in a different way, and some kill more than one player a night.",
  },
};
const SETUP = [[5, 3, 0, 1, 1], [6, 3, 1, 1, 1], [7, 5, 0, 1, 1], [8, 5, 1, 1, 1], [9, 5, 2, 1, 1], [10, 7, 0, 2, 1],
               [11, 7, 1, 2, 1], [12, 7, 2, 2, 1], [13, 9, 0, 3, 1], [14, 9, 1, 3, 1], [15, 9, 2, 3, 1]];

// cards stay open across re-renders
const openCards = new Set();

function almanac() {
  const s = state || {}, n = (s.seats || []).length, deo = !!s.dead_eyes;
  const script = s.script || "trouble_brewing", bmr = script === "bad_moon_rising";
  const card = (id, c) => `<details data-id="${id}" ${openCards.has(id) ? "open" : ""} ontoggle="openCards[this.open ? 'add' : 'delete'](this.dataset.id)"><summary>${glyph(id)}<span class="nm ${tone(c.type)}-text">${esc(c.name)}</span>`
    + `<span class="tag">${esc(c.timing || "")}</span><span class="sum">${esc(c.summary)}</span></summary>`
    + `<div class="body"><p>${esc(c.ability)}</p>${c.flavour ? `<q>${esc(c.flavour)}</q>` : ""}</div></details>`;
  const groups = ["townsfolk", "outsider", "minion", "demon"].map(t => {
    const i = TYPE_INTRO[t];
    return `<h3>${TYPE_LABEL[t]}${t === "demon" ? "" : "s"}</h3>
      <p class="lede"><b>${i.side}.</b> Goal: ${i.goal} ${TYPE_NOTE[script][t]}</p>
      ${Object.entries(chars).filter(([, c]) => c.type === t && c.script === script).map(([id, c]) => card(id, c)).join("")}`;
  }).join("");

  const evilInfo = deo
    ? "Dead Eyes Only: the Minions and the Demon are always woken on the first night and shown each other, whatever the player count."
    : "In games of 7 or more players, the Minions are woken together on the first night and shown the Demon (so they also see each other), and the Demon is shown their Minions plus three good characters that are not in play, which are safe to bluff as. In games of 5 or 6 players neither step happens, so evil starts out not knowing its own team.";
  const rules = [
    bmr ? "Good wins the moment the Demon dies, unless the Mastermind keeps the game going for one more day."
        : "Good wins the moment the Demon dies, whether by execution, the Slayer, or any other way.",
    bmr ? "Evil wins when only two players are alive and the Demon is one of them."
        : "Evil wins when only two players are alive and the Demon is one of them, or if the Saint is executed.",
    bmr ? "Any living player may nominate once per day, and each player may be nominated once per day. Dead players can be nominated too."
        : "Any living player may nominate once per day, and each player may be nominated once per day.",
    "Execution needs votes from at least half the living players, rounded up. The nominee with the most votes is executed at the end of the day. A tie for the most votes means no execution, and at most one execution happens per day.",
    bmr ? "Several players can die in one night, and some players survive things that should kill them. Being executed does not always mean dying."
        : "Only the Virgin's trigger causes an execution without a vote.",
    "Dead players keep talking freely, but lose their ability and get only one more vote for the rest of the game.",
    deo ? "Dead Eyes Only: living players do not know their own character. When you die, you are privately shown who you really were. Nobody else is told."
        : "A player's character is never revealed when they die.",
    bmr ? "An ability can malfunction when its holder is drunk or poisoned, and the player is not told. In Bad Moon Rising many abilities make other players drunk."
        : "An ability can malfunction (Drunk or poisoned), and the player holding it is not told when that happens.",
    "You may say anything, including lies. Only the Storyteller's rulings are binding, and you can ask them a question privately at any time.",
  ];
  const table = `<table><tr><th>Players</th><th>Townsfolk</th><th>Outsiders</th><th>Minions</th><th>Demon</th></tr>${
    SETUP.map(r => `<tr class="${r[0] === n ? "here" : ""}">${r.map(v => `<td>${v}</td>`).join("")}</tr>`).join("")}</table>
    <p class="lede">${bmr ? "If the Godfather is in play there is one more or one fewer Outsider, with Townsfolk adjusted to match." : "If the Baron is in play there are two more Outsiders and two fewer Townsfolk."} The counts are public, but who holds which character is secret.${n >= 5 && n <= 15 ? ` This game has ${n} players.` : ""}</p>`;

  return `<section class="almanac"><h2>Every character in ${esc(s.script_name || "this script")}</h2>
    <p class="lede">Tap a character to read its full ability. The abilities aren't spoilers. Only who holds them is secret.</p>
    ${groups}
    <h3>Quick rules</h3><ul class="ref">${rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h3>Setup by player count</h3>${table}
    <h3>What evil knows on the first night</h3><p class="lede">${esc(evilInfo)}</p>
  </section>`;
}

function setDaylight(phase) {
  const night = phase === "night";
  document.body.classList.toggle("day", !night);
  document.querySelector('meta[name="theme-color"]').content = night ? "#221A2A" : "#1B2B27";
}

// shrink character names that would spill past the seal's rim
function fitNames(root) {
  root.querySelectorAll(".token .char").forEach(c => {
    c.style.fontSize = "";
    const maxH = c.parentElement.clientHeight * 0.7;
    let fs = parseFloat(getComputedStyle(c).fontSize);
    while ((c.scrollWidth > c.clientWidth || c.offsetHeight > maxH) && fs > 6) c.style.fontSize = `${fs -= 0.5}px`;
  });
}

function render() {
  setDaylight(state?.phase);
  if (!token || !state || !state.me) { $app.innerHTML = joinScreen(); return; }
  const s = state, me = s.me;
  // only table-wide buzzes vibrate, so a phone never singles out its owner
  if (lastBuzz !== null && Number(lastBuzz) !== s.buzz && s.buzz > 0 && navigator.vibrate) navigator.vibrate(200);
  lastBuzz = String(s.buzz);
  localStorage.setItem("tb_buzz", lastBuzz);
  // every living player sees the same nudge at night, whether or not they have anything to do
  const nudge = !revealed && ((s.phase === "night" && me.alive) || me.messages.length > seen || (me.prompt && !me.prompt.answer));

  const counts = s.counts && Object.keys(s.counts).length
    ? `<p class="empty">In play: ${Object.entries(s.counts).map(([t, k]) => `${k} ${TYPE_LABEL[t]}${k === 1 || t === "townsfolk" ? "" : "s"}`).join(", ")}.</p>` : "";

  document.title = scriptName();
  let html = `<div class="top"><h1>${esc(scriptName())}</h1><div class="when">${esc(me.name)}${me.alive ? "" : ", dead"}<br>${when(s)}</div></div>`;
  if (s.winner) html += `<div class="verdict paper"><h2 class="${s.winner}-text">${s.winner === "good" ? "Good" : "Evil"} wins</h2><p>${esc(s.win_reason)}</p></div>`;
  if (nudge) html += `<button class="call" onclick="flip()"><b>${s.phase === "night" ? `Night ${s.night}` : "Dawn"}</b>${
    s.dead_eyes ? "Everyone does this: shield your screen and check for instructions."
                : "Everyone does this: shield your screen and open your token."}</button>`;
  if (error) html += `<p class="err">${esc(error)}</p>`;

  const news = JSON.stringify(s.announcements);
  if (view === "square") heard = news;
  if (view === "character") {
    html += hero(me);
    if (s.phase === "day") html += dayTimer(s);
    if (revealed) {
      html += `<section><h2>From the Storyteller</h2>${prompt(s, me)}${
        me.messages.length ? me.messages.slice().reverse().map(m => `<div class="slip paper"><span class="when">${esc(m.label)}</span>${esc(m.text)}</div>`).join("")
                           : `<p class="empty">Nothing yet. Anything you learn at night appears here.</p>`}</section>`;
      if (me.notes) html += noteBox(me);
    }
  } else if (view === "square") {
    html += `<section><h2>Town square</h2>${dayTimer(s)}${ring(s, me)}${counts}</section>`;
    if (s.announcements.length) {
      html += `<section><h2>${s.phase === "day" ? "Today" : "Last heard"}</h2><ul class="crier">${s.announcements.map(a => `<li>${esc(a)}</li>`).join("")}</ul></section>`;
    }
  } else {
    html += almanac();
  }

  const tab = (v, label, fresh) => `<button onclick="show('${v}')" ${view === v ? 'aria-current="page"' : ""}>${label}${fresh ? `<span class="fresh" aria-label="new"></span>` : ""}</button>`;
  html += `<nav class="tabs">${tab("character", "Character", view !== "character" && nudge)}${tab("square", "Town square", s.announcements.length && news !== heard)}${tab("almanac", "Almanac")}</nav>`;
  $app.innerHTML = html;
  fitNames($app);
}

api("/api/characters").then(c => { chars = c; render(); });
poll();
setInterval(poll, 1500);
setInterval(() => { tickHide(); tickDayTimer(); }, 1000);
</script>
</body>
</html>
